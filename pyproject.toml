[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-why"
version = "0.1.0"
description = "Explain why a Home Assistant entity changed, and find ghost pulses of presence sensors at night"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Home Automation",
]

[project.scripts]
ha-why = "ha_why.__main__:main"

[tool.setuptools]
packages = ["ha_why"]
